acl internal {
  localhost;
  localnets;
  192.168.1.0/24;
};

acl tailscale {
  100.64.0.0/10;
};

options {
  directory "/var/cache/bind";

  forwarders {
    1.1.1.1;
    1.0.0.1;
  };
  allow-query {
    internal;
    tailscale;
  };
};

view "lan" {
  match-clients { internal; };
  recursion yes;
  allow-recursion { internal; };
  allow-query-cache { internal; };

  zone "juanlabs.org" IN {
    type master;
    file "/etc/bind/juanlabs_lan.zone";
  };
};

view "tailnet" {
  match-clients { tailscale; };
  recursion no;

  zone "juanlabs.org" IN {
    type master;
    file "/etc/bind/juanlabs_tailnet.zone";
  };
};

